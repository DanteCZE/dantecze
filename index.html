<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Rozcestník Aplikací</title>
    
    <!-- Tailwind CSS pro moderní a responzivní vzhled bez psaní vlastního CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Knihovna Lucide pro krásné a jednotné ikony -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Vlastní nastavení pro Tailwind (volitelné, pro jemné doladění barev) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5', // Indigová barva
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-primary selection:text-white">

    <!-- Hlavička stránky -->
    <header class="pt-16 pb-10 text-center px-4">
        <div class="inline-flex items-center justify-center p-3 bg-primary/10 rounded-full mb-4">
            <i data-lucide="layout-grid" class="w-8 h-8 text-primary"></i>
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900 mb-4">
            Moje Aplikace
        </h1>
        <p class="text-lg text-slate-600 max-w-2xl mx-auto">
            Vítej v rozcestníku. Zde najdeš všechny mé vytvořené nástroje a aplikace přehledně na jednom místě.
        </p>
    </header>

    <!-- Hlavní kontejner pro mřížku aplikací -->
    <main class="flex-grow container mx-auto px-4 pb-16 max-w-6xl">
        <!-- Zde se pomocí JavaScriptu vygenerují jednotlivé kategorie a karty -->
        <div id="obsah-aplikaci" class="space-y-12">
            <!-- Obsah se načítá dynamicky... -->
        </div>
    </main>

    <!-- Patička -->
    <footer class="py-6 text-center text-slate-500 text-sm border-t border-slate-200 mt-auto">
        <p>&copy; <span id="rok"></span> - DanteCZE</p>
    </footer>

    <!-- LOGIKA APLIKACE A DATA -->
    <script>
        // ==========================================
        // 1. ZDE PŘIDÁVEJ SVÉ APLIKACE
        // ==========================================
        // Pro přidání nové aplikace stačí zkopírovat jeden blok v závorkách {...}
        // Seznam všech dostupných ikon najdeš na: https://lucide.dev/icons
        
        const seznamAplikaci = [
            {
                nazev: "Moje Eurona",
                popis: "Správce zásob a objednávek z Eurony.",
                odkaz: "https://mojeeurona.web.app/", // Sem dej URL nebo název souboru
                ikona: "sparkles",      // Název ikony z webu Lucide
                barvaPozadiIkony: "bg-[#f8fafc]",
                barvaIkony: "text-[#a855f7]",
                kategorie: "Správa domácnosti" // <-- NOVÁ VLASTNOST
            },
            {
                nazev: "Můj Mrazák",
                popis: "Správce zásob v mrazácích.",
                odkaz: "https://mujmrazak.web.app/",
                ikona: "snowflake",
                barvaPozadiIkony: "bg-[#f8fafc]",
                barvaIkony: "text-[#2563eb]",
                kategorie: "Správa domácnosti"
            },
            {
                nazev: "MyBau",
                popis: "Nákupní seznam pro Bauhaus.",
                odkaz: "https://mybau.netlify.app/",
                ikona: "shopping-cart",
                barvaPozadiIkony: "bg-[#E3000F]",
                barvaIkony: "text-[#F4F4F4]",
                kategorie: "Nákupy"
            },
			{
                nazev: "AOI Rework",
                popis: "Pomocník k reworkování.",
                odkaz: "https://aoirework.web.app/",
                ikona: "cpu", // hledej na lucide.dev
                barvaPozadiIkony: "bg-[#f8fafc"]",
                barvaIkony: "text-[#2563eb]",
                kategorie: "Nástroje"
            }

            // PŘIKLAD DALŠÍ APLIKACE (smaž lomítka a uprav):
            // ,{
            //     nazev: "Moje nová aplikace",
            //     popis: "Krátký popis toho, co aplikace umí.",
            //     odkaz: "https://nova-aplikace.cz",
            //     ikona: "star", // hledej na lucide.dev
            //     barvaPozadiIkony: "bg-gray-200",
            //     barvaIkony: "text-gray-700",
            //     kategorie: "Ostatní nástroje"
            // }
        ];

        // ==========================================
        // 2. VYKRESLENÍ (Do tohoto kódu už nemusíš zasahovat)
        // ==========================================
        
        const kontejner = document.getElementById('obsah-aplikaci');

        // 1. Automatické řazení aplikací podle abecedy (podle názvu)
        seznamAplikaci.sort((a, b) => a.nazev.localeCompare(b.nazev, 'cs'));

        // 2. Seskupení aplikací do kategorií
        const aplikacePodleKategorii = {};
        seznamAplikaci.forEach(app => {
            const kat = app.kategorie || "Ostatní";
            if (!aplikacePodleKategorii[kat]) {
                aplikacePodleKategorii[kat] = [];
            }
            aplikacePodleKategorii[kat].push(app);
        });

        // 3. Řazení samotných kategorií podle abecedy
        const serazeneKategorie = Object.keys(aplikacePodleKategorii).sort((a, b) => a.localeCompare(b, 'cs'));

        // 4. Vykreslení kategorií a jejich aplikací
        serazeneKategorie.forEach(kategorie => {
            // Vytvoření sekce pro celou kategorii
            const sekceKategorie = document.createElement('div');
            
            // Nadpis kategorie
            const nadpis = document.createElement('h2');
            nadpis.className = "text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-200 pb-2";
            nadpis.innerHTML = `<i data-lucide="folder" class="w-6 h-6 text-primary"></i> ${kategorie}`;
            sekceKategorie.appendChild(nadpis);

            // Mřížka pro aplikace v dané kategorii
            const mrizka = document.createElement('div');
            mrizka.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6";

            // Vykreslení karet
            aplikacePodleKategorii[kategorie].forEach(app => {
                const karta = document.createElement('a');
                karta.href = app.odkaz;
                karta.target = "_blank"; // Otevře se na nové záložce
                
                karta.className = `
                    group bg-white rounded-2xl p-6 shadow-sm border border-slate-200
                    hover:shadow-md hover:border-primary/30 hover:-translate-y-1
                    transition-all duration-300 ease-in-out flex flex-col h-full
                    focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2
                `;

                // Vyčištění odkazu pro zobrazení (odstraní https:// a případné lomítko na konci)
                const zobrazenyOdkaz = app.odkaz.replace(/^https?:\/\//, '').replace(/\/$/, '');

                karta.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="p-3 rounded-xl ${app.barvaPozadiIkony} ${app.barvaIkony} group-hover:scale-110 transition-transform duration-300 border border-slate-100">
                            <i data-lucide="${app.ikona}" class="w-6 h-6"></i>
                        </div>
                        <div class="text-slate-300 group-hover:text-primary transition-colors duration-300">
                            <i data-lucide="external-link" class="w-5 h-5"></i>
                        </div>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2 group-hover:text-primary transition-colors duration-300">
                        ${app.nazev}
                    </h3>
                    <p class="text-slate-600 text-sm leading-relaxed flex-grow">
                        ${app.popis}
                    </p>
                    <div class="mt-5 pt-4 border-t border-slate-100 flex items-center text-slate-400 text-sm truncate group-hover:text-primary/80 transition-colors duration-300">
                        <i data-lucide="link-2" class="w-4 h-4 mr-2 flex-shrink-0"></i>
                        <span class="truncate">${zobrazenyOdkaz}</span>
                    </div>
                `;

                mrizka.appendChild(karta);
            });

            sekceKategorie.appendChild(mrizka);
            kontejner.appendChild(sekceKategorie);
        });

        // Automatické nastavení aktuálního roku v patičce
        document.getElementById('rok').textContent = new Date().getFullYear();

        // Inicializace ikon Lucide (musí se zavolat až po vygenerování HTML)
        lucide.createIcons();

    </script>
</body>
</html>
