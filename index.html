    <script>
        const seznamAplikaci = JSON.parse(document.getElementById('directory-data').textContent);

        // ==========================================
        // 2. VYKRESLENÍ (Do tohoto kódu už nemusíš zasahovat)
        // ==========================================
        
        const kontejner = document.getElementById('obsah-aplikaci');

        // 1. Automatické řazení aplikací podle abecedy (podle názvu)
        seznamAplikaci.sort((a, b) => a.nazev.localeCompare(b.nazev, 'cs'));

        // 2. Seskupení aplikací do kategorií
        const aplikacePodleKategorii = {};
        seznamAplikaci.forEach(app => {
            const kat = app.kategorie || "Ostatní";
            if (!aplikacePodleKategorii[kat]) {
                aplikacePodleKategorii[kat] = [];
            }
            aplikacePodleKategorii[kat].push(app);
        });

        // 3. Řazení samotných kategorií podle abecedy
        const serazeneKategorie = Object.keys(aplikacePodleKategorii).sort((a, b) => a.localeCompare(b, 'cs'));

        const vytvorIkonu = (nazev, tridy) => {
            const ikona = document.createElement('i');
            ikona.setAttribute('data-lucide', nazev);
            ikona.className = tridy;
            return ikona;
        };

        // 4. Vykreslení kategorií a jejich aplikací
        serazeneKategorie.forEach(kategorie => {
            // Vytvoření sekce pro celou kategorii
            const sekceKategorie = document.createElement('div');
            
            // Nadpis kategorie
            const nadpis = document.createElement('h2');
            nadpis.className = "text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-200 pb-2";
            nadpis.append(vytvorIkonu('folder', 'w-6 h-6 text-primary'), document.createTextNode(kategorie));
            sekceKategorie.appendChild(nadpis);

            // Mřížka pro aplikace v dané kategorii
            const mrizka = document.createElement('div');
            mrizka.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6";

            // Vykreslení karet
            aplikacePodleKategorii[kategorie].forEach(app => {
                const karta = document.createElement('a');
                karta.href = app.odkaz;
                karta.target = "_blank"; // Otevře se na nové záložce
                karta.rel = "noopener noreferrer";
                
                karta.className = `
                    group bg-white rounded-2xl p-6 shadow-sm border border-slate-200
                    hover:shadow-md hover:border-primary/30 hover:-translate-y-1
                    transition-all duration-300 ease-in-out flex flex-col h-full
                    focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2
                `;

                const hlavickaKarty = document.createElement('div');
                hlavickaKarty.className = 'flex items-start justify-between mb-4';

                const obalIkony = document.createElement('div');
                obalIkony.className = `p-3 rounded-xl ${app.barvaPozadiIkony} ${app.barvaIkony} group-hover:scale-110 transition-transform duration-300 border border-slate-100`;
                obalIkony.appendChild(vytvorIkonu(app.ikona, 'w-6 h-6'));

                const odkazIkona = document.createElement('div');
                odkazIkona.className = 'text-slate-300 group-hover:text-primary transition-colors duration-300';
                odkazIkona.appendChild(vytvorIkonu('external-link', 'w-5 h-5'));
                hlavickaKarty.append(obalIkony, odkazIkona);

                const nadpisKarty = document.createElement('h3');
                nadpisKarty.className = 'text-xl font-bold text-slate-800 mb-2 group-hover:text-primary transition-colors duration-300';
                nadpisKarty.textContent = app.nazev;

                const popisKarty = document.createElement('p');
                popisKarty.className = 'text-slate-600 text-sm leading-relaxed flex-grow';
                popisKarty.textContent = app.popis;

                const patickaKarty = document.createElement('div');
                patickaKarty.className = 'mt-5 pt-4 border-t border-slate-100 flex items-center text-slate-400 text-sm truncate group-hover:text-primary/80 transition-colors duration-300';
                patickaKarty.appendChild(vytvorIkonu('link-2', 'w-4 h-4 mr-2 flex-shrink-0'));

                const textOdkazu = document.createElement('span');
                textOdkazu.className = 'truncate';
                textOdkazu.textContent = app.odkaz.replace(/^https?:\/\//, '').replace(/\/$/, '');
                patickaKarty.appendChild(textOdkazu);

                karta.append(hlavickaKarty, nadpisKarty, popisKarty, patickaKarty);

                mrizka.appendChild(karta);
            });

            sekceKategorie.appendChild(mrizka);
            kontejner.appendChild(sekceKategorie);
        });

        // Automatické nastavení aktuálního roku v patičce
        document.getElementById('rok').textContent = new Date().getFullYear();

        // Inicializace ikon Lucide (musí se zavolat až po vygenerování HTML)
        lucide.createIcons();

    </script>
